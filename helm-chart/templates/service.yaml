{{- $service := .Values.service | default dict }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
{{- if $service.enabled }}
  type: {{ $service.type | default "ClusterIP" }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $service.port | default 80 }}
      targetPort: {{ $service.targetPort | default 8080 }}
{{- end }}
