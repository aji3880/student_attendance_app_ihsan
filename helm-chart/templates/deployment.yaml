apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    app: {{ include "helm-chart.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "helm-chart.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "helm-chart.fullname" . }}
      annotations: {{ toYaml .Values.podAnnotations | nindent 8 }}
    spec:
  template:
    spec:
  template:
    spec:
  template:
    spec:
      {{- $sa := .Values.serviceAccount | default dict }}
      serviceAccountName: {{ default (include "helm-chart.fullname" .) $sa.name }}
      {{- $sc := .Values.securityContext | default dict }}
      securityContext:
        runAsUser: {{ default 1000 $sc.runAsUser }}
        runAsNonRoot: {{ default true $sc.runAsNonRoot }}
        fsGroup: {{ default 1000 $sc.fsGroup }}
      containers:
        - name: {{ include "helm-chart.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $svc := .Values.service | default dict }}
          ports:
            - containerPort: {{ default 8080 $svc.targetPort }}
              name: http
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources: {{ toYaml .Values.resources | nindent 12 }}