metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    app: {{ include "helm-chart.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "helm-chart.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "helm-chart.fullname" . }}
      annotations: {{ toYaml .Values.podAnnotations | nindent 8 }}
