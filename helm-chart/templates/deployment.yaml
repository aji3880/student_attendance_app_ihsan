apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    app: {{ include "helm-chart.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "helm-chart.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "helm-chart.fullname" . }}
      annotations: {{ toYaml .Values.podAnnotations | nindent 8 }}
    spec:
  template:
    spec:
  template:
    spec:
  template:
    spec:
      {{- $sa := .Values.serviceAccount | default dict }}
      serviceAccountName: {{ default (include "helm-chart.fullname" .) $sa.name }}
      {{- $sc := .Values.securityContext | default dict }}
      securityContext:
        runAsUser: {{ default 1000 $sc.runAsUser }}
        runAsNonRoot: {{ default true $sc.runAsNonRoot }}
        fsGroup: {{ default 1000 $sc.fsGroup }}
      containers:
        - name: {{ include "helm-chart.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $svc := .Values.service | default dict }}
          ports:
            - containerPort: {{ default 8080 $svc.targetPort }}
              name: http
          {{- $lprobe := .Values.livenessProbe | default dict }}
          livenessProbe:
            httpGet:
              path: {{ default "/" $lprobe.path }}
              port: {{ default 8080 $lprobe.port }}
            initialDelaySeconds: {{ default 10 $lprobe.initialDelaySeconds }}
            periodSeconds: {{ default 10 $lprobe.periodSeconds }}
            timeoutSeconds: {{ default 2 $lprobe.timeoutSeconds }}
            failureThreshold: {{ default 3 $lprobe.failureThreshold }}

          {{- $rprobe := .Values.readinessProbe | default dict }}
          readinessProbe:
            httpGet:
              path: {{ default "/" $rprobe.path }}
              port: {{ default 8080 $rprobe.port }}
            initialDelaySeconds: {{ default 5 $rprobe.initialDelaySeconds }}
            periodSeconds: {{ default 5 $rprobe.periodSeconds }}
            timeoutSeconds: {{ default 2 $rprobe.timeoutSeconds }}
            failureThreshold: {{ default 3 $rprobe.failureThreshold }}

          resources: {{ toYaml .Values.resources | nindent 12 }}