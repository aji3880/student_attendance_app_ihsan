{{- if .Values.route.create }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "frontend-app.fullname" . }}
  labels:
    {{- include "frontend-app.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "frontend-app.fullname" . }}
  port:
    port: {{  .Values.route.port }}
    targetPort: {{ .Values.route.targetPort }}
  tls:
    insecureEdgeTermininationPolicy: None
    termination: edge
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
{{- end }}
